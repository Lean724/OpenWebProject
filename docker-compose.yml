# ==============================================================================
# OpenWebProject - Docker Compose Configuration
# Usage:
#   docker compose up -d
# Access:
#   http://localhost:8080
# ==============================================================================
services:
  openwebproject:
    build:
      context: .
      dockerfile: Dockerfile
    image: openwebproject:latest
    container_name: openwebproject
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      - NODE_ENV=production
